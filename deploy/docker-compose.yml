services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: recallibrate_demo
      POSTGRES_USER: recallibrate_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD}
    volumes:
      - recallibrate-demo-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallibrate_admin -d recallibrate_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  app:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DEMO_DATABASE_URL: postgresql://recallibrate_reader:${DEMO_READER_PASSWORD}@db:5432/recallibrate_demo
      RECALLIBRATE_PORTFOLIO_ONLY: "false"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      RECALLIBRATE_ALLOWED_DISCORD_IDS: ${RECALLIBRATE_ALLOWED_DISCORD_IDS}
      RECALLIBRATE_ALLOW_ANY_DISCORD_USER: ${RECALLIBRATE_ALLOW_ANY_DISCORD_USER:-true}
      RECALLIBRATE_DATABASE_ASSIGNMENTS: ${RECALLIBRATE_DATABASE_ASSIGNMENTS}
      RECALLIBRATE_ALLOWED_DB_HOSTS: ${RECALLIBRATE_ALLOWED_DB_HOSTS}
      RECALLIBRATE_CREDENTIAL_KEY: ${RECALLIBRATE_CREDENTIAL_KEY}
      RECALLIBRATE_STATE_PATH: /data/recallibrate-state.sqlite3
      RECALLIBRATE_SECURE_COOKIES: "true"
      RECALLIBRATE_ALLOW_SELF_SERVICE_DATABASES: "true"
      ASH_DATABASE_URL: ${ASH_DATABASE_URL}
      ARI_DATABASE_URL: ${ARI_DATABASE_URL}
      ASHRIEL_DATABASE_URL: ${ASHRIEL_DATABASE_URL}
      GRAY_DATABASE_URL: ${GRAY_DATABASE_URL}
      KAI_DATABASE_URL: ${KAI_DATABASE_URL}
      KYLE_DATABASE_URL: ${KYLE_DATABASE_URL}
      LUMEN_DATABASE_URL: ${LUMEN_DATABASE_URL}
      SILAS_DATABASE_URL: ${SILAS_DATABASE_URL}
      SOLSTICE_DATABASE_URL: ${SOLSTICE_DATABASE_URL}
      AERON_DATABASE_URL: ${AERON_DATABASE_URL}
    volumes:
      - recallibrate-state:/data
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.recallibrate-gzip.compress=true
      - traefik.http.middlewares.recallibrate-https.redirectscheme.scheme=https
      - traefik.http.routers.recallibrate-http.entrypoints=http
      - traefik.http.routers.recallibrate-http.rule=Host(`recallibrate.app`)
      - traefik.http.routers.recallibrate-http.middlewares=recallibrate-https
      - traefik.http.routers.recallibrate-https.entrypoints=https
      - traefik.http.routers.recallibrate-https.rule=Host(`recallibrate.app`)
      - traefik.http.routers.recallibrate-https.tls=true
      - traefik.http.routers.recallibrate-https.tls.certresolver=letsencrypt
      - traefik.http.routers.recallibrate-https.middlewares=recallibrate-gzip
      - traefik.http.services.recallibrate.loadbalancer.server.port=8000
      - traefik.http.routers.recallibrate-http.service=recallibrate
      - traefik.http.routers.recallibrate-https.service=recallibrate
    networks:
      - private
      - coolify

volumes:
  recallibrate-demo-data:
  recallibrate-state:

networks:
  private:
    internal: true
  coolify:
    external: true
